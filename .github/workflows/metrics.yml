name: Metrics

on:
  # 01:37 Beijing time (17:37 UTC). Deliberately off the hour because
  # GitHub delays scheduled runs under load, and the top of the hour
  # is the most congested slot.
  schedule: [{cron: "37 17 * * *"}]
  # Manual runs from the Actions tab
  workflow_dispatch:
  # Re-run when the workflow itself changes
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Single card: base sections, most used languages and the
      # full-year contribution calendar. Keeping everything in one
      # render avoids repeating the base stats across separate cards.
      - name: Sube-py
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sube-py
          filename: metrics/metrics.Sube-py.svg
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 6
          plugin_languages_threshold: 0%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Shanghai
          config_animations: no
